name: Update module repository

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-modules.yml"
      - "json/config.json"
      - "modules/**"
  schedule:
    # The offset avoids the busiest point of the hour.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-module-repository
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MMRL-Util
        run: pip install --disable-pip-version-check mmrl-util==2.15.24

      - name: Fetch releases and rebuild the MMRL index
        env:
          # MMRL-Util versions use both names internally for GitHub release
          # discovery and metadata requests.
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_API_TOKEN: ${{ github.token }}
        run: |
          # mmrl-util parses each module ZIP to extract its metadata and the
          # current version/versionCode, and rebuilds the public MMRL index.
          # The ZIPs it downloads are only used transiently for parsing: the
          # resulting update.json/modules.json do NOT reference them, because
          # several modules are larger than GitHub's 100 MB per-file limit and
          # could never be committed to this repository.
          mmrl-util sync --force --size 300 --single
          mmrl-util index
          jq 'del(.id)' json/modules.json > /tmp/modules.json
          mv /tmp/modules.json json/modules.json

          # Replace the self-hosted (broken 404) download links with direct
          # links to the canonical upstream GitHub release asset.
          python .github/update_urls.py --root "$GITHUB_WORKSPACE"

          # Do not publish a partial repository: every enabled track must be
          # represented in MMRL's index and expose its newest ZIP download.
          expected_ids="$(jq -s '[.[] | select(.enable == true) | .id] | sort' modules/*/track.json)"
          jq -e --argjson expected "$expected_ids" '
            (.modules | map(.id)) as $published |
            (($expected - $published) | length == 0) and
            all(.modules[]; (.versions[-1].zipUrl? | type) == "string")
          ' json/modules.json

          # Every module must install from a direct upstream release, never a
          # self-hosted link on this repository's Pages (those do not exist).
          jq -e '
            all(.modules[];
              (.versions[-1].zipUrl? | type) == "string" and
              ((.versions[-1].zipUrl | ascii_downcase) | contains("github.io") | not)
            )
          ' json/modules.json || {
            echo "::error::Self-hosted github.io download link found in json/modules.json"
            exit 1
          }

          # Assert that MMRL will install the current artifact for every module.
          for update_file in modules/*/update.json; do
            module_id="$(jq -r '.id' "$update_file")"
            latest_zip_url="$(jq -r '.versions[-1].zipUrl' "$update_file")"
            jq -e --arg id "$module_id" --arg url "$latest_zip_url" \
              'any(.modules[]; .id == $id and .versions[-1].zipUrl == $url)' \
              json/modules.json > /dev/null
          done

      - name: Commit updated modules
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add json/modules.json modules .github/update_urls.py
          git commit -m "Update module releases"
          git push
