name: Update module repository

on:
  schedule:
    # The offset avoids the busiest point of the hour.
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-module-repository
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MMRL-Util
        run: pip install --disable-pip-version-check mmrl-util==2.15.24

      - name: Fetch releases and rebuild the MMRL index
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # Sync writes the newest compatible upstream release to each module
          # metadata file and rebuilds the public MMRL index.
          mmrl-util sync --size 300 --single
          jq 'del(.id)' json/modules.json > /tmp/modules.json
          mv /tmp/modules.json json/modules.json

          # Do not publish a partial repository: every enabled track must be
          # represented in MMRL's index and expose its newest ZIP download.
          expected_ids="$(jq -s '[.[] | select(.enable == true) | .id] | sort' modules/*/track.json)"
          jq -e --argjson expected "$expected_ids" '
            (.modules | map(.id)) as $published |
            (($expected - $published) | length == 0) and
            all(.modules[]; (.versions[0].zipUrl? | type) == "string")
          ' json/modules.json

      - name: Commit updated modules
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add json/modules.json modules
          git commit -m "Update module releases"
          git push
